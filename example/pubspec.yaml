name: example
description: "An example of using the flutter_operations package"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_operations:
    path: ../
  flutter_bloc: ^9.1.1
  flutter_mobx: ^2.4.0
  flutter_riverpod: ^3.4.3
  mobx: ^2.7.0
  provider: ^6.1.5+1
  signals_flutter: ^7.1.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mobx_codegen: ^2.8.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
